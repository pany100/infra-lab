global
  maxconn 100

defaults
  mode tcp
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend postgres_replicas_in
  bind *:5432
  default_backend postgres_replicas

backend postgres_replicas
  balance roundrobin
  option tcp-check
  server replica1 db-replica-1:5432 check inter 2s rise 2 fall 3
  server replica2 db-replica-2:5432 check inter 2s rise 2 fall 3
  server replica3 db-replica-3:5432 check inter 2s rise 2 fall 3

listen stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats
  stats refresh 5s
